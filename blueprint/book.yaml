exemptions:
- edge:
  - TAO1.2
  - TAO1.3
  why: Tao ch 3 uses the natural numbers of ch 2 only in examples and in §3.6 (finite cardinality). The main line
    takes ℕ, induction and well-ordering as given (relations-and-induction precedes countable-and-uncountable);
    Tao ch 2 is used only in the optional zf-and-natural-numbers, which decisions.md item 4 puts beside the main
    line.
- edge:
  - VEL.4
  - VEL.5
  why: Velleman ch 4 is split. §4.1–4.2 (ordered pairs, products, relations), which is all that ch 5 (functions)
    uses, is drawn on in sets-and-functions together with ch 5; §4.3–4.5 (orders, equivalence relations) goes to
    relations-and-induction.
- edge:
  - HAM.11
  - HAM.12
  why: 'Hammack ch 11 is split in the same way: §11.1 (relations as subsets of a product) is used in sets-and-functions;
    §11.2–11.5 goes to relations-and-induction.'
- edge:
  - FX.4
  - FX.6
  why: forall x ch 6 is split. §6.1–6.3 (sentential rules, derived rules) needs only the sentential material and
    is used in connectives-and-derivations and negation-and-classical-logic; §6.4–6.6 (quantifier and identity rules) is used in predicate-logic
    together with ch 4.
- edge:
  - PMA.2
  - PMA.3
  why: Rudin's chapter 3 works in metric spaces and uses chapter 2 compactness only for 3.6 (BW via compactness)
    and for general metric spaces. Specialized to ℝ, sequences-and-limits proves BW by the monotone-subsequence
    and nested-interval routes from the LUB axiom, so PMA.3 §3.1–3.20 on ℝ needs only PMA.1. PMA.2 is then used
    in topology-of-the-real-line, after sequences, in Abbott's order (ABB.2 before ABB.3).
- edge:
  - ABB.6
  - ABB.7
  why: Abbott 7 is split. §7.1–7.3, 7.5–7.6 (definition, integrability, FTC, Lebesgue's criterion) need only ABB.4–5;
    only the 'Uniform Convergence and Integration' part of §7.4 uses ABB.6, and it goes to sequences-of-functions,
    after ABB.6. This is Rudin's order (PMA.6 before PMA.7) and lets the integral remainder and log = ∫dt/t be available
    for power series.
- edge:
  - SPI.8
  - SPI.22
  why: Spivak's chapter 22 needs chapter 8 only for the least upper bound property, which our least-upper-bound
    chapter supplies from the axiom. SPI.8's own content (proofs of the three hard theorems, uniform continuity)
    is used later, in continuity-on-intervals; SPI.22 is a problems source for sequences-and-limits.
- edge:
  - BRR.5
  - BRR.6
  why: Bressoud 6 is split. §6.2–6.3 (Cauchy's and Riemann's integral, Riemann's criterion) are used as motivation
    in riemann-darboux-integral and need only continuity; §6.4 (continuity without differentiability) goes to sequences-of-functions
    together with BRR.5 §5.2–5.4. BRR.5 §5.1 is already used in infinite-series, so BRR.5 is first read before BRR.6.
- edge:
  - WZ.7
  - WZ.9
  why: WZ ch 9 is split. §9.1 and the Lᵖ-norm convergence of approximations of the identity (§9.2, first half) need
    only Lᵖ (WZ ch 8) and are used in lp-spaces; the a.e. convergence at Lebesgue points (§9.2, second half) and
    §9.3 need WZ §7.2–7.3 and are placed in lebesgue-differentiation, after WZ ch 7.
- edge:
  - WZ.7
  - WZ.10
  why: WZ ch 10 is split. §10.1–10.2 (abstract measures and integration) need only WZ ch 5 and are used in abstract-measure;
    §10.3 and §10.5 (absolute continuity, relative differentiation) use WZ ch 7 and are placed in signed-measures-radon-nikodym,
    after it.
- edge:
  - WZ.2
  - WZ.7
  why: WZ ch 7 is split. §7.1–7.3 (indefinite integrals, Lebesgue differentiation, Vitali covering) use no BV theory
    and go to lebesgue-differentiation; §7.4–7.6 (monotone and AC functions), which need WZ ch 2, go to bv-and-absolute-continuity
    together with WZ ch 2.
- edge:
  - SS3.4
  - SS3.6
  why: SS3 ch 6 §1–3 (Carathéodory, extension, products, Lebesgue–Stieltjes) need no Hilbert space and are used
    in abstract-measure and fubini-tonelli. Only §4 (Radon–Nikodym via von Neumann) uses SS3 ch 4, and that section
    is placed in signed-measures-radon-nikodym, after lp-spaces where SS3 ch 4 §1 (L²) is used; the rest of SS3
    ch 4 goes to Part VI.
