parts:
- num: '0'
  title: 'Foundations: Logic, Sets, Numbers'
  summary: Teaches the grammar of proof (natural deduction for connectives, its truth-table semantics with soundness
    and completeness, the quantifier and equality rules, and the passage from derivations to mathematical prose),
    then sets, functions, relations, induction and cardinality as the main-line bridge, and, beside the main line,
    builds ℕ, ℤ, ℚ and ℝ and proves the complete ordered field unique; forced by a reader who has never written
    a proof and by Part I's decision to start from the least upper bound axiom.
- num: I
  title: Analysis on the Real Line
  summary: Starting from the least upper bound axiom alone, Part I builds ε-N and ε-δ fluency on ℝ through sequences,
    series, the topology of the line, continuity, the derivative, the Riemann–Darboux integral, uniform convergence
    and power series, because each classical theorem of calculus (IVT, EVT, MVT, FTC, term-by-term differentiation)
    fails or is unprovable without completeness; it closes by proving that the forms of completeness are equivalent.
- num: II
  title: Metric Spaces and Several Variables
  summary: 'Lifts convergence, completeness, compactness and continuity from ℝ to metric spaces and C(K), forced
    by concrete problems (ODE existence and uniqueness, polynomial approximation, typical continuous functions),
    then does calculus in ℝⁿ: inverse and implicit functions, linear systems with the matrix exponential and the
    flow, and the Riemann integral on ℝⁿ. General topology waits for Part VI, where it is used; Part II ends with
    Gate II.'
- num: III
  title: Fourier Analysis in the Riemann Setting
  summary: 'Fourier series and the Fourier transform on 𝒮(ℝᵈ), built entirely on the Riemann integral: summability,
    mean-square and pointwise convergence, applications, and (optionally) finite abelian groups and Dirichlet''s
    theorem. The Part ends by listing what the Riemann framework cannot do, and that list motivates Part IV.'
- num: IV
  title: Measure and Integration
  summary: Starting from Part III's list of what the Riemann integral lacks, build Lebesgue measure and the Lebesgue
    integral on ℝᵈ, then abstract measures, products (Fubini–Tonelli and change of variables in full), surfaces
    and the divergence theorem, Lᵖ, modes of convergence, differentiation, and signed measures up to Radon–Nikodym,
    ending with probability on measure spaces (the laws of large numbers and the central limit theorem). Lusin and
    the density of C_c use only the metric Urysohn and Tietze theorems of Part II.
- num: V
  title: Complex Analysis
  summary: Complex differentiability turns out to be so rigid that one integral formula controls everything; the
    Part runs from Goursat to the Riemann mapping theorem and then through the qualifying-exam second layer (harmonic
    and subharmonic functions, normal families, products, continuation, Picard), with normal families as the complex
    spiral node of Arzelà–Ascoli.
- num: VI
  title: Functional Analysis and Distributions
  summary: 'The Dirichlet problem forces the move from function spaces to abstract ones: the Part opens with the
    general topology it needs (topological spaces, products and compactness; separation, Urysohn–Tietze and locally
    compact spaces), settles what was moved out of measure theory (Lᵖ duality, Riesz–Markov, weak and weak* topologies,
    with Tychonoff just before Banach–Alaoglu), builds Hahn–Banach, Baire, Hilbert and compact-operator theory,
    then distributions, 𝒮′, interpolation and Sobolev spaces, and ends with the Lax–Milgram solution of the Dirichlet
    problem and the Dirichlet-Laplacian eigenbasis.'
chapters:
- num: 1
  part: '0'
  slug: connectives-and-derivations
  title: Connectives and Derivations
  pages: 25
  sources:
  - - HR.1
    - '§1.1 declarative sentences; §1.2.1 the rules for ∧, →, ∨ (scaffolding: order and depth)'
  - - CH.2
    - §2.1–2.4 conjunction, conditional, disjunction by introduction and elimination rules (informal ND)
  - - CH.3
    - §3.4 propositional natural deduction (the rules for ∧, →, ∨)
  - - CH.4
    - Wason task (motivation for the conditional)
  - - FX.6
    - §6.1–6.2 Fitch-style proofs, the sentential rules for ∧, →, ∨, subproofs
  - - VEL.1
    - §1.1 deductive reasoning and logical connectives (alt)
  - - HAM.2
    - §2.1–2.4 statements, and, or, conditional (problems)
  outline:
  - 'Statements and connectives: declarative sentences, ∧, ∨, →, ¬, ⊥ as symbols for mathematical English; formulas
    and brackets; sequents φ₁, …, φₙ ⊢ ψ'
  - 'The derivation format: premises, numbered lines, justifications; how to read a Fitch derivation line by line'
  - '∧I and ∧E: each rule defined by its Fitch schema; first worked derivations'
  - '→E (using an implication): modus ponens as a rule; chains of implications'
  - '→I and the box: opening an assumption, its scope, discharge; what may be cited from inside and outside a box'
  - '∨I: weakening a statement; why P ⊢ P∨Q is not a loss of truth but of information'
  - '∨E (proof by cases): two boxes with a common conclusion; cases in analysis (x ≥ 0 or x < 0)'
  must_prove:
  - P∧Q ⊢ Q∧P and (P∧Q)∧R ⊢ P∧(Q∧R) by ∧I and ∧E
  - (P→Q)∧(Q→R) ⊢ P→R (→I with →E inside the box)
  - P→(Q→R) ⊣⊢ (P∧Q)→R
  - P∨Q ⊢ Q∨P and P∧(Q∨R) ⊢ (P∧Q)∨(P∧R) by ∨E
  - '|x| ≥ x for every real x, by cases, each step labelled by its rule'
  key_examples:
  - 'Wason selection task: the conditional is not the biconditional'
  - 'an illegal citation: a line from inside a closed box used outside it'
  - 'a proof by cases on x ≥ 0 or x < 0 written as ∨E'
  exit_checks:
  - Write a Fitch derivation of (P→Q)∧(Q→R) ⊢ P→R and then the same argument as fluent prose
  - Derive (P∧Q)∨(P∧R) ⊢ P∧(Q∨R), naming the rule on each line
  - Find the illegal line in a derivation that cites an assumption after its box closes
  optional: false
  note: 'First of the two propositional chapters (the former propositional-natural-deduction split in two, author,
    2026-09-28); modelled on the depth of Huth & Ryan §1.1–1.2. Each rule is DEFINED by its Fitch schema (an nd block
    with metavariables); each section introduces exactly one new rule or idea; long-form, many worked derivations
    (author, 2026-09-28). Rules first, semantics in semantics-soundness-completeness (decisions 2: truth tables after
    the rules). Every rule gets at least one analysis-flavoured example (decisions 1). The rule / phrase / Lean table
    is started here (∧, →, ∨ rows), continued in negation-and-classical-logic and completed in predicate-logic. Lean
    is shown, never required.'
- num: 2
  part: '0'
  slug: negation-and-classical-logic
  title: Negation, Classical Logic and Finding Derivations
  pages: 30
  sources:
  - - HR.1
    - '§1.2.1 the rules for ¬ and ⊥; §1.2.2 derived rules (MT, ¬¬i, PBC, LEM); §1.2.3 natural deduction in summary;
      §1.2.4 provable equivalence (scaffolding: order and depth)'
  - - CH.2
    - §2.5–2.7 negation, biconditional, ex falso and classical reasoning (informal ND)
  - - VDL.1
    - '§1.4 natural deduction (depth: rule forms, RAA vs ¬I)'
  - - FX.6
    - §6.3 derived rules, proof strategy for sentential derivations
  - - VEL.1
    - §1.5 conditional and biconditional laws (alt)
  - - HAM.2
    - §2.5–2.6 biconditional, logical equivalence (problems)
  outline:
  - '¬E and ⊥E: contradiction, ex falso quodlibet, vacuous truth derived from ⊥E'
  - '¬I (proving a negation): assume and reach ⊥; √2 is irrational as an instance of ¬I'
  - 'Derived rules: what a derived rule is (an abbreviation of a derivation schema); modus tollens, contrapositive,
    disjunctive syllogism'
  - '↔ and definitions: ↔I and ↔E; the ''if'' of a definition means ''iff'' (a convention of language, not a rule
    of logic)'
  - 'RAA and classical logic: why ¬I is not proof by contradiction; ¬¬E, LEM, De Morgan (the direction that needs
    RAA), Peirce''s law; provable equivalence ⊣⊢'
  - 'Finding derivations: the search method (backwards from the goal, forwards from the premises, which rule to
    try first, when to reach for RAA); the rules in one place; the propositional half of the rule / phrase / Lean
    table'
  must_prove:
  - ⊥ ⊢ P and ¬P ⊢ P→Q (vacuous truth from ⊥E)
  - √2 is irrational (an instance of ¬I, valid intuitionistically)
  - P→Q ⊢ ¬Q→¬P by →I and ¬I (modus tollens as a derived rule); the converse ¬Q→¬P ⊢ P→Q needs RAA
  - P∨Q, ¬P ⊢ Q (disjunctive syllogism)
  - 'for integers n: n² even ⇒ n even (via contrapositive), with each step labelled by its rule'
  - ¬¬i, RAA and LEM derived from the basic rules (RAA and LEM from ¬¬E)
  - De Morgan laws by natural deduction, flagging that ¬(P∧Q) ⊢ ¬P∨¬Q uses RAA; Peirce's law
  - distributivity of ∧ over ∨ as a provable equivalence
  key_examples:
  - '''x² < 0 ⇒ x = 7'' is true for every real x (vacuous truth)'
  - definition 'f is increasing if …' used in both directions
  - 'a failed derivation attempt: the goal-directed search stalls, and RAA is what unblocks it'
  exit_checks:
