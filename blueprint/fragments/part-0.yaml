  CH.B: "denotational semantics, beyond scope"
  FX.1: "informal notions of validity; covered by the book's own intro"
  FX.2: "symbolization of SL; subsumed by CH.2"
  FX.3: "truth tables; subsumed by CH.3 §3.5 (tables come after the rules, decisions 2)"
