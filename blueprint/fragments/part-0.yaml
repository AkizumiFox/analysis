part: "0"
title: "Foundations: Logic, Sets, Numbers"
summary: "Teaches the grammar of proof (natural deduction for connectives, quantifiers and equality), then sets, functions, relations, induction and cardinality as the main-line bridge, and, beside the main line, builds ℕ, ℤ, ℚ and ℝ and proves the complete ordered field unique; forced by a reader who has never written a proof and by Part I's decision to start from the least upper bound axiom."

