  - "'What is not allowed' catalogue tied rule by rule to common errors (CH and VEL cover the rules; the catalogue itself is original)"
  - "Selden & Selden style proof-verification tasks (four flawed student proofs)"
  - "Negating uniform continuity and uniform convergence (HAM.13 covers only ε–δ limits)"
  - "Excluded-middle history: Brouwer 1908, Hilbert 1927 and the Grundlagenstreit, Heyting 1930, Gödel–Gentzen translation, Bishop 1967 (VDL.5 §5.1 is brief)"
  - "Constructive consequences for analysis: located sup, Specker's sequence, approximate IVT, non-constructive step in Bolzano–Weierstrass (no assigned source)"
  - "Curry–Howard, Lean's Classical.em via Diaconescu, and noncomputable (no assigned source)"
  - "Cross-Part list of where choice is used (Vitali, Hahn–Banach, Tychonoff)"
