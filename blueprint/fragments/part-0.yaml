  MEN.G: "complex numbers; Part I or Part V introduces ℂ"
  LAN.5: "complex numbers; Part I or Part V introduces ℂ"

exemptions:
  - edge: [TAO1.2, TAO1.3]
    why: "Tao ch 3 uses the natural numbers of ch 2 only in examples and in §3.6 (finite cardinality). The main line takes ℕ, induction and well-ordering as given (relations-and-induction precedes countable-and-uncountable); Tao ch 2 is used only in the optional zf-and-natural-numbers, which decisions.md item 4 puts beside the main line."
  - edge: [VEL.4, VEL.5]
    why: "Velleman ch 4 is split. §4.1–4.2 (ordered pairs, products, relations), which is all that ch 5 (functions) uses, is drawn on in sets-and-functions together with ch 5; §4.3–4.5 (orders, equivalence relations) goes to relations-and-induction."
  - edge: [HAM.11, HAM.12]
    why: "Hammack ch 11 is split in the same way: §11.1 (relations as subsets of a product) is used in sets-and-functions; §11.2–11.5 goes to relations-and-induction."
  - edge: [FX.4, FX.6]
    why: "forall x ch 6 is split. §6.1–6.3 (sentential rules, derived rules) needs only the sentential material and is used in logic-connectives; §6.4–6.6 (quantifier and identity rules) is used in quantifiers-and-proof together with ch 4."

coverage_gaps:
