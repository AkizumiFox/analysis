part: VI
title: "Functional Analysis and Distributions"
summary: "The Dirichlet problem forces the move from function spaces to abstract ones: the Part first settles what was moved out of measure theory (Lᵖ duality, Riesz–Markov, weak and weak* topologies, with Tychonoff just before Banach–Alaoglu), builds Hahn–Banach, Baire, Hilbert and compact-operator theory, then distributions, 𝒮′ and Sobolev spaces, and ends with the Lax–Milgram solution of the Dirichlet problem and the Dirichlet-Laplacian eigenbasis."
