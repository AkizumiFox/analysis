chapters:
  - slug: banach-spaces-lp-duality
    title: "Banach Spaces, Dual Spaces and the Dual of Lᵖ"
    pages: 50
    sources: [[SS4.1, "§3–4, §6 Banach spaces, linear functionals and the dual, dual of Lᵖ for 1≤p<∞, complex spaces"], [FOL.5, "§5.1–5.2 normed vector spaces, bounded linear maps, linear functionals"], [KRE.2, "§2.4–2.10 finite dimension, compactness, bounded operators, dual spaces of ℝⁿ, ℓ¹, ℓᵖ (bridge)"], [LAX.5, "§5.1–5.2 norms, non-compactness of the unit ball"]]
    outline:
      - "Normed and Banach spaces again (spiral from Part II and Part IV): ℓᵖ, c₀, C(K), Lᵖ; completeness via absolutely convergent series"
      - "Bounded linear maps: bounded ⇔ continuous, B(X,Y) is a Banach space, the BLT extension principle"
      - "Finite dimension: Riesz's lemma and 'the closed unit ball is compact iff dim X < ∞'"
      - "Subspaces and quotients: the quotient norm and completeness of X/M"
      - "Dual spaces of sequence spaces: (ℓᵖ)* = ℓ^q, c₀* = ℓ¹, (ℓ¹)* = ℓ^∞"
      - "The dual of Lᵖ for 1<p<∞ by Radon–Nikodym, and (L¹)* = L^∞ for σ-finite μ"
      - "What is still missing: (L^∞)* and the need for Hahn–Banach (forward pointer)"
    must_prove: ["B(X,Y) is complete when Y is", "BLT: a bounded operator on a dense subspace extends uniquely with the same norm", "Riesz's lemma; unit ball compact ⇔ finite dimension", "X/M is Banach when M is closed", "(ℓᵖ)* ≅ ℓ^q and c₀* ≅ ℓ¹", "Lᵖ duality for 1<p<∞", "(L¹)* = L^∞ for σ-finite measures"]
    key_examples: ["the L¹ norm on C[0,1] is incomplete (recalled)", "differentiation on C¹ ⊂ C[0,1] is unbounded", "duals of c₀ and ℓ¹", "(L¹)* ≠ L^∞ for a non-σ-finite measure (counting-type example, exercise)"]
    exit_checks: ["Prove the dual of Lᵖ (1<p<∞) is L^q, including the isometry", "Show c₀* = ℓ¹ isometrically and identify the canonical map c₀ → c₀**"]
    optional: false
    note: "Opens the Part with Lᵖ duality as decided (decisions.md 9). Proof via Radon–Nikodym ties directly to Part IV; Brezis's uniform-convexity proof appears later in weak-topologies-alaoglu as a second proof. Folland §6.2 is the natural extra reference, but FOL.6 is a Part IV node."
  - slug: riesz-markov
    title: "Radon Measures and the Dual of C₀(X)"
    pages: 38
    sources: [[FOL.7, "§7.1–7.3 positive functionals on C_c(X), regularity and approximation, dual of C₀(X)"], [SS4.1, "§7 appendix: the dual of C(X)"], [LAX.A, "Riesz–Kakutani representation via Daniell-type construction (alternative)"]]
    outline:
      - "Why functionals on continuous functions are measures: Riemann–Stieltjes on [a,b] as the prototype"
      - "Positive linear functionals on C_c(X) are automatically bounded on each C(K)"
      - "Construction of the measure from open sets; Urysohn partitions of unity; the Riesz–Markov theorem"
      - "Regularity of Radon measures; density of C_c in Lᵖ(μ) revisited"
      - "Complex Radon measures, total variation norm, the Banach space M(X)"
      - "The dual of C₀(X) is M(X); decomposition of a real functional into positive parts"
      - "First look at weak* convergence: δ_{x_n} → δ_x, Riemann sums as measures converging to Lebesgue"
    must_prove: ["Riesz–Markov for positive linear functionals on C_c(X), X locally compact Hausdorff", "outer and inner regularity of the constructed measure", "a bounded real functional on C₀(X) is a difference of positive ones", "C₀(X)* ≅ M(X) isometrically"]
    key_examples: ["δ_x as a functional on C(K)", "Lebesgue measure recovered from the Riemann integral on C_c(ℝ)", "a positive functional on C_c(ℝ) not extendable boundedly to C₀(ℝ)"]
    exit_checks: ["Prove Riesz–Markov for C(K), K compact metric (outline allowed for general LCH)", "Show the unit ball of M([0,1]) contains δ-measures at distance 2 from each other, so M([0,1]) is not separable"]
    optional: false
    note: "Riesz–Markov is placed in Part VI per decisions.md 9. It uses only Part IV measure construction and Urysohn, not Hahn–Banach, so it can precede hahn-banach; outline-level proof is allowed by the curriculum but the C(K), K compact metric case should be complete."
  - slug: hahn-banach
    title: "The Hahn–Banach Theorems"
    pages: 50
    sources: [[BRZ.1, "§1.1–1.3 analytic and geometric forms, bidual, orthogonality relations"], [SS4.1, "§5 separation of convex sets, Hahn–Banach, consequences, problem of measure"], [KRE.4, "§4.1–4.6 Zorn, Hahn–Banach (real, complex, normed), Riesz on C[a,b], adjoint operator, reflexive spaces (bridge)"], [LAX.3, "extension and geometric Hahn–Banach"], [LAX.4, "positive extensions, Banach limits, invariant set functions"], [LAX.8, "§8.1–8.3 bounded functionals, extension, reflexive spaces"], [LAX.C, "Zorn's lemma"], [FOL.5, "§5.2 Hahn–Banach and consequences"]]
    outline:
      - "Zorn's lemma recalled; sublinear functionals and the analytic Hahn–Banach theorem"
      - "Complex and normed versions; norming functionals; X* separates points"
      - "The bidual: the canonical embedding J: X → X** is an isometry; annihilators and duals of subspaces and quotients"
      - "The Minkowski gauge and the geometric forms: separating an open convex set from a point, strict separation"
      - "Density criterion: a subspace is dense iff every functional vanishing on it is zero"
      - "Adjoint operators between Banach spaces; ‖T*‖ = ‖T‖"
      - "Banach limits; (ℓ^∞)* ≠ ℓ¹ and (L^∞)* ≠ L¹; Riesz's original theorem on C[a,b] via Hahn–Banach"
    must_prove: ["analytic Hahn–Banach (sublinear domination)", "complex Hahn–Banach", "existence of norming functionals", "J: X → X** is an isometry", "first and second geometric forms (separation)", "density criterion via annihilators", "existence of Banach limits"]
    key_examples: ["Banach limit on ℓ^∞: a functional not given by any ℓ¹ sequence", "separation fails without openness/compactness (two closed convex sets at distance 0)", "finitely additive translation-invariant 'measure' on all subsets of ℝ (problem of measure)"]
    exit_checks: ["Prove Hahn–Banach (analytic and first geometric form) from Zorn's lemma", "Show (ℓ^∞)* is strictly larger than ℓ¹ using a Banach limit"]
    optional: false
    note: "Duality arguments (decisions.md 14) are named here: test against functionals. Uses Zorn from Part 0."
  - slug: baire-category-operators
    title: "Baire Category and the Fundamental Theorems for Operators"
    pages: 45
    sources: [[SS4.4, "§1–4 Baire, uniform boundedness, divergence of Fourier series, open mapping, decay of Fourier coefficients, closed graph, Grothendieck"], [BRZ.2, "§2.1–2.4 Baire, UBP, open mapping, closed graph, complementary subspaces"], [KRE.4, "§4.7, §4.12–4.13 category theorem, uniform boundedness, open mapping, closed graph (bridge)"], [LAX.15, "boundedness and continuity, uniform boundedness, open mapping principle"], [FOL.5, "§5.3 Baire category theorem and consequences"]]
    outline:
      - "The Baire category theorem recalled (Part II) and the shape of a Baire argument"
      - "The uniform boundedness principle (Banach–Steinhaus); pointwise limits of operators are bounded"
      - "A continuous function whose Fourier series diverges at a point"
      - "The open mapping theorem and the bounded inverse theorem; comparing complete norms"
      - "The closed graph theorem; Hellinger–Toeplitz"
      - "Fourier coefficients of L¹ functions do not exhaust c₀"
      - "Complemented subspaces and Grothendieck's theorem on closed subspaces of Lᵖ (optional section)"
    must_prove: ["uniform boundedness principle", "existence of a continuous function with divergent Fourier series at 0 (via UBP)", "open mapping theorem", "bounded inverse theorem", "closed graph theorem", "the map f ↦ (f̂(n)) from L¹(𝕋) to c₀ is not onto"]
    key_examples: ["the Dirichlet partial-sum functionals with norms ~ log N", "two comparable complete norms are equivalent", "an everywhere-defined symmetric operator on a Hilbert space is bounded (Hellinger–Toeplitz)", "UBP fails on an incomplete space (c₀₀ with sup norm)"]
    exit_checks: ["Prove, via the UBP, that there is a continuous function whose Fourier series diverges at 0", "Prove the closed graph theorem from the open mapping theorem"]
    optional: false
    note: "Second appearance of Baire (first in Part II with nowhere-differentiable functions); the text explicitly recalls it. Placed before weak topologies because weakly convergent sequences are bounded only by the UBP."
  - slug: weak-topologies-alaoglu
    title: "Weak Topologies, Tychonoff and Banach–Alaoglu"
    pages: 60
    sources: [[BRZ.3, "§3.1–3.6 coarsest topologies, weak topology, convex sets, weak* topology, Banach–Alaoglu, reflexive and separable spaces"], [BRZ.4, "§4.3 reflexivity, separability, dual of Lᵖ via uniform convexity; L¹ and L^∞"], [BRZ.11, "§11.3 classical sequence spaces"], [MUN.5, "§37 the Tychonoff theorem"], [LAX.10, "uniform boundedness of weakly convergent sequences, weak sequential compactness, weak* convergence"], [LAX.11, "§11.1–11.2 approximation of δ, divergence of Fourier series revisited"], [LAX.12, "weak and weak* topologies"], [LAX.13, "§13.1–13.2 separation by functionals, Krein–Milman"], [KRE.4, "§4.8–4.9 strong and weak convergence (bridge)"], [FOL.5, "§5.4 topological vector spaces, weak topologies"]]
    outline:
      - "Initial topologies; the weak topology σ(X,X*); weak neighbourhoods are unbounded in infinite dimension"
      - "Weak convergence of sequences: eₙ ⇀ 0 in ℓ², sin(nx) ⇀ 0 in L²; weakly convergent sequences are bounded; weak lower semicontinuity of the norm"
      - "Mazur's theorem: closed convex sets are weakly closed; convex combinations converge strongly"
      - "The weak* topology; weak* convergence of measures and approximation of δ"
      - "Tychonoff's theorem (via Zorn), and the diagonal proof for countable products of compact metric spaces"
      - "Banach–Alaoglu: the general proof by Tychonoff; the separable case by a diagonal argument; metrizability of the dual ball"
      - "Reflexivity and separability: bounded sequences in reflexive spaces have weakly convergent subsequences; Lᵖ reflexive (1<p<∞); X* separable ⇒ X separable; c₀, ℓ¹, L¹, L^∞ not reflexive"
      - "Extreme points and Krein–Milman; why L¹[0,1] is not a dual space"
    must_prove: ["weakly convergent sequences are bounded, and ‖x‖ ≤ liminf ‖xₙ‖", "Mazur's theorem", "Tychonoff's theorem", "Banach–Alaoglu (general, and separable case by diagonal extraction)", "in a reflexive space every bounded sequence has a weakly convergent subsequence", "X* separable ⇒ X separable", "Lᵖ is reflexive for 1<p<∞"]
    key_examples: ["eₙ ⇀ 0 weakly but not strongly", "c₀ is not reflexive", "in ℓ¹ weak and norm convergence of sequences coincide (Schur, exercise)", "L¹[0,1] is not isometric to any dual space (unit ball has no extreme points)", "δ_{1/n} → δ_0 weak* in C[0,1]* but not in norm"]
