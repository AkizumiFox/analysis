  - edge: [WZ.7, WZ.10]
    why: "WZ ch 10 is split. §10.1–10.2 (abstract measures and integration) need only WZ ch 5 and are used in abstract-measure; §10.3 and §10.5 (absolute continuity, relative differentiation) use WZ ch 7 and are placed in signed-measures-radon-nikodym, after it."
  - edge: [WZ.2, WZ.7]
    why: "WZ ch 7 is split. §7.1–7.3 (indefinite integrals, Lebesgue differentiation, Vitali covering) use no BV theory and go to lebesgue-differentiation; §7.4–7.6 (monotone and AC functions), which need WZ ch 2, go to bv-and-absolute-continuity together with WZ ch 2."
