part: IV
title: "Measure and Integration"
summary: "Starting from Part III's list of what the Riemann integral lacks, build Lebesgue measure and the Lebesgue integral on ℝᵈ, then abstract measures, products (Fubini–Tonelli and change of variables in full), Lᵖ, modes of convergence, differentiation, and signed measures up to Radon–Nikodym, preceded by the Urysohn and Tietze theorems that Lusin and the density of C_c need."

