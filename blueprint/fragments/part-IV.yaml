  - slug: lp-spaces
    title: "Lᵖ Spaces, Convolution and Mollifiers"
    pages: 58
    sources: [[FOL.6, "§6.1 (basic theory) and §6.3 (Minkowski's integral inequality, Young's inequality)"], [MIRA.7, "all (Hölder, Minkowski, completeness, a.e.-convergent subsequences)"], [WZ.8, "§8.1–8.6 (Lᵖ, Hölder, Minkowski, ℓᵖ, completeness, density, Fourier series and Parseval)"], [WZ.9, "§9.1 and the Lᵖ-norm part of §9.2 (convolution, approximations of the identity)"], [BRL.8, "§8.2–8.4 (Lᵖ spaces, Riesz–Fischer, complete orthonormal sets)"], [SS3.2, "§2 (translation continuity)"], [SS3.4, "§1 (the space L² and its completeness)"]]
    outline:
      - "Lᵖ norms; Young's inequality for products, Hölder, Minkowski; L^∞ and the essential supremum"
      - "Completeness (Riesz–Fischer); Lᵖ convergence gives an a.e.-convergent subsequence; inclusions on finite measure spaces and for ℓᵖ"
      - "Density in Lᵖ, p < ∞: simple, step, and C_c functions (via Lusin/Urysohn); failure for p = ∞"
      - "Continuity of translation in Lᵖ, p < ∞"
      - "Convolution: Minkowski's integral inequality, Young's inequality ‖f*g‖_p ≤ ‖f‖_p‖g‖₁, smoothing properties"
      - "Approximate identities in Lᵖ norm; mollifiers; C_c^∞(ℝᵈ) is dense in Lᵖ; smooth Urysohn functions"
      - "L²(𝕋) completes ℛ(𝕋): Riesz–Fischer for Fourier series, Parseval for all f ∈ L²(𝕋), Fejér in L¹ norm and uniqueness for L¹(𝕋) — the Part III list closed"
    must_prove: ["Hölder's inequality", "Minkowski's inequality", "Lᵖ(μ) is complete for 1 ≤ p ≤ ∞", "C_c(ℝᵈ) dense in Lᵖ for 1 ≤ p < ∞", "‖τ_h f − f‖_p → 0 for p < ∞", "Young's inequality ‖f*g‖_p ≤ ‖f‖_p‖g‖₁", "mollification f*φ_ε ∈ C^∞ and → f in Lᵖ", "L²(𝕋) ↔ ℓ²(ℤ) via Fourier coefficients is an isometric isomorphism"]
    key_examples: ["x^{−a} on (0,1) and (1,∞): which Lᵖ", "L^∞ is not separable and C_c is not dense in L^∞", "the standard bump e^{−1/(1−|x|²)}", "Lᵖ(0,1) ⊃ L^q(0,1) for p<q but no inclusion on ℝ"]
    exit_checks: ["Prove that Lᵖ is complete", "Prove C_c^∞ is dense in Lᵖ(ℝᵈ), p < ∞", "Show that every (c_n) ∈ ℓ²(ℤ) is the coefficient sequence of some f ∈ L²(𝕋)"]
    optional: false
    note: "Only concrete L² (completeness, Parseval on 𝕋) appears; abstract Hilbert space theory is Part VI (decisions.md 9). Lᵖ duality is Part VI; state no duality theorem here. Pointwise convergence of approximate identities at Lebesgue points waits for lebesgue-differentiation."

  - slug: modes-of-convergence
    title: "Modes of Convergence, Uniform Integrability and Weak Lᵖ"
    pages: 36
    sources: [[FOL.2, "§2.4 (modes of convergence)"], [FOL.6, "§6.4 (distribution functions and weak Lᵖ)"], [WZ.4, "§4.4 (convergence in measure)"], [BRL.6, "§6.4 (convergence in measure)"], [MIRA.2, "§2E (pointwise and uniform convergence)"], [GO.8, "Example 40 (sequences converging in different senses)"]]
    outline:
      - "The modes: a.e., uniform, almost uniform, in measure, in Lᵖ; Egorov revisited as 'a.e. ⇒ almost uniform on finite measure'"
      - "The four sequences (typewriter, n·1_(0,1/n), 1_[n,n+1], n^{−1/p}·1_[0,n]) and the full implication diagram; Riesz: in measure ⇒ a.e.-convergent subsequence"
      - "Uniform integrability; the Vitali convergence theorem (finite measure, then with tightness); de la Vallée-Poussin criterion"
      - "Choosing a tool: MCT, DCT, Fatou or Vitali (the limit-exchange checklist, final form)"
      - "The distribution function; Chebyshev–Markov; the layer-cake formula ∫|f|ᵖ = p∫₀^∞ λ^{p−1} μ(|f|>λ) dλ"
      - "Weak Lᵖ: the quasi-norm, Lᵖ ⊂ weak Lᵖ, |x|^{−d/p} ∈ weak Lᵖ \\ Lᵖ"
    must_prove: ["convergence in measure ⇒ a.e.-convergent subsequence", "Lᵖ convergence ⇒ convergence in measure", "a.e. ⇒ in measure on finite measure spaces", "Vitali convergence theorem: fₙ → f a.e., (fₙ) uniformly integrable, μ(X) < ∞ ⇒ fₙ → f in L¹", "on finite measure, fₙ → f in L¹ ⇔ UI + in measure", "layer-cake formula (by Tonelli)", "Chebyshev inequality; ‖f‖_{p,∞} ≤ ‖f‖_p"]
    key_examples: ["typewriter sequence", "n·1_(0,1/n)", "1_[n,n+1]", "n^{−1/p}·1_[0,n]", "|x|^{−d/p} in weak Lᵖ but not Lᵖ", "1/x on (0,1) in weak L¹"]
    exit_checks: ["Draw the implication diagram of the four modes of convergence with a counterexample for every non-implication", "Prove the Vitali convergence theorem"]
    optional: false
    note: "Uniform integrability and the Vitali convergence theorem are original writing (no assigned source treats them beyond exercises). Weak L¹ is set up here because lebesgue-differentiation's maximal inequality is a weak-(1,1) statement."

  - slug: lebesgue-differentiation
    title: "The Maximal Function and Lebesgue Differentiation"
    pages: 50
    sources: [[SS3.3, "§1–2 (Hardy–Littlewood maximal function, Lebesgue differentiation, good kernels and approximations to the identity)"], [WZ.7, "§7.1–7.3 (indefinite integral, Lebesgue's differentiation theorem, Vitali covering lemma)"], [WZ.9, "§9.2 (a.e. convergence at Lebesgue points), §9.3 (Hardy–Littlewood maximal function)"], [MIRA.4, "all (maximal function, derivatives, Lebesgue density theorem)"], [FOL.3, "§3.4 up to Theorem 3.20 (differentiation on Euclidean space)"]]
    outline:
      - "The question: is d/dx ∫ₐˣ f = f a.e.? Averages over balls and the obstruction"
      - "The Vitali covering lemma (finite, 3ᵈ version) and the Vitali covering theorem for fine covers"
      - "The Hardy–Littlewood maximal function; the weak (1,1) inequality; the Lᵖ bound for p > 1 via the layer-cake formula"
      - "The Lebesgue differentiation theorem: the template 'prove it on a dense class, extend with the maximal inequality'"
      - "Lebesgue points and density points; the Lebesgue density theorem"
      - "Approximations to the identity converge at every Lebesgue point; Fejér and Poisson means of L¹(𝕋) functions converge a.e. (closing Part III)"
    must_prove: ["Vitali covering lemma", "Vitali covering theorem (fine covers)", "weak (1,1) maximal inequality", "‖Mf‖_p ≤ C_p‖f‖_p for 1 < p ≤ ∞", "Lebesgue differentiation theorem", "a.e. point is a Lebesgue point", "Lebesgue density theorem", "f*K_ε → f at Lebesgue points for approximate identities with radially decreasing integrable majorant"]
    key_examples: ["Mf ∉ L¹ for f = 1_[0,1] (Mf ~ 1/|x|)", "density of a fat Cantor set at its points", "a set with density ½ everywhere cannot exist (exercise)"]
    exit_checks: ["Prove Lebesgue differentiation from the covering lemma up", "Show Fejér means of f ∈ L¹(𝕋) converge a.e. to f"]
    optional: false
    note: "Name and drill the maximal-function argument skill. Uses weak L¹ and the layer-cake formula from modes-of-convergence. The last part of FOL §3.4 (differentiating regular measures) is deferred to signed-measures-radon-nikodym."

  - slug: bv-and-absolute-continuity
    title: "Bounded Variation, Absolute Continuity and the Fundamental Theorem"
    pages: 58
    sources: [[SS3.3, "§3–4 (BV, Cantor–Lebesgue function, AC, jump functions, rectifiable curves; §4.2* isoperimetric optional)"], [FOL.3, "§3.5 (functions of bounded variation)"], [WZ.2, "§2.1–2.2 (BV, rectifiable curves)"], [WZ.7, "§7.4–7.6 (differentiation of monotone functions, AC and singular functions, integration by parts)"], [BRL.7, "all (Dini derivatives, monotone ⇒ differentiable a.e., AC, Lebesgue's FTC)"], [GO.8, "Examples 15, 18, 30"]]
    outline:
      - "Functions of bounded variation: total variation, Jordan decomposition into increasing functions; rectifiable curves"
      - "Monotone functions are differentiable a.e.: Dini derivatives and the Vitali covering theorem (Riesz's rising-sun lemma as an alternative); ∫ₐᵇ f' ≤ f(b) − f(a)"
      - "The Cantor–Lebesgue function and strictly increasing singular functions; jump functions are differentiable a.e. with derivative 0"
      - "Absolutely continuous functions; the fundamental theorem of calculus for the Lebesgue integral, both directions"
      - "Decomposition of a BV function: absolutely continuous + jump + singular continuous"
      - "Integration by parts and substitution for AC functions; arc length of a rectifiable curve is ∫|γ'| iff γ is AC"
      - "(Optional) The isoperimetric inequality for rectifiable curves, returning to Part III's Hurwitz proof"
    must_prove: ["Jordan decomposition of BV functions", "monotone functions are differentiable a.e. and ∫f' ≤ f(b)−f(a)", "BV ⇒ differentiable a.e.", "F(x) = ∫ₐˣ f is AC and F' = f a.e.", "f AC ⇒ f' ∈ L¹ and f(x) − f(a) = ∫ₐˣ f'", "AC with f' = 0 a.e. ⇒ constant", "decomposition BV = AC + jump + singular", "L(γ) = ∫|γ'| for AC curves"]
    key_examples: ["Cantor–Lebesgue function", "a strictly increasing function with f' = 0 a.e.", "x² sin(1/x²) differentiable but not BV", "√x AC on [0,1] but not Lipschitz", "a jump function with jumps at the rationals"]
    exit_checks: ["Prove the fundamental theorem of calculus for AC functions", "Show the Cantor function is continuous, increasing, not AC, with f' = 0 a.e."]
    optional: false
    note: "Answers the Part III item 'the FTC fails' (Volterra). WZ ch 7 is split: §7.1–7.3 went to lebesgue-differentiation, §7.4–7.6 are here with WZ ch 2 (see exemptions)."

  - slug: signed-measures-radon-nikodym
    title: "Signed Measures, Radon–Nikodym and Lebesgue Decomposition"
    pages: 56
    sources: [[FOL.3, "§3.1–3.3 (signed measures, Lebesgue–Radon–Nikodym, complex measures), end of §3.4 (Theorem 3.22), §3.5 Theorems 3.29–3.36 (NBV ↔ measures)"], [SS3.6, "§4 (signed measures, absolute continuity; von Neumann's L² proof)"], [MIRA.9, "§9A, §9B up to the Lebesgue decomposition (not 'Dual space of Lᵖ')"], [MIRA.8, "8.34–8.47 and the Riesz representation 8.47 (specialized to L²(μ))"], [WZ.10, "§10.3 (absolutely continuous and singular set functions), §10.5 (relative differentiation)"], [GO.8, "Example 41"]]
    outline:
      - "Signed measures; positive, negative and null sets; the Hahn decomposition; the Jordan decomposition; total variation |ν|"
      - "Complex measures and their total variation (brief)"
      - "Absolute continuity and mutual singularity; the ε-δ characterization for finite ν"
      - "An L² toolkit proved for L²(μ) only: parallelogram law, nearest point in a closed subspace, every bounded linear functional on L²(μ) is integration against some g"
      - "Radon–Nikodym and Lebesgue decomposition by von Neumann's proof: finite measures, then σ-finite; the chain rule for dν/dμ"
      - "Where it fails: Lebesgue measure ≪ counting measure on [0,1] with no density"
      - "Measures on ℝᵈ and ℝ: differentiation of measures dν/dm = lim ν(B)/m(B) a.e.; NBV functions ↔ finite Borel measures, F AC ⇔ μ_F ≪ m, and the BV decomposition as a Lebesgue decomposition"
    must_prove: ["Hahn decomposition theorem", "Jordan decomposition theorem", "ν ≪ μ ⇔ ε-δ condition (ν finite)", "L²(μ) projection onto a closed subspace and representation of bounded functionals on L²(μ)", "Radon–Nikodym theorem (σ-finite) via von Neumann", "Lebesgue decomposition theorem, with uniqueness", "dν/dm(x) = lim ν(B(x,r))/m(B(x,r)) a.e. for regular ν on ℝᵈ", "F ∈ NBV is AC ⇔ μ_F ≪ m"]
    key_examples: ["ν(E) = ∫_E f dμ with f of both signs; its Hahn sets", "Dirac δ₀ ⊥ m", "Cantor measure ⊥ m", "counting vs Lebesgue on [0,1]: RN fails without σ-finiteness"]
    exit_checks: ["Prove Radon–Nikodym by von Neumann's L² argument", "Prove the Hahn decomposition", "Six UCLA real-analysis qual problems in 3 hours, at least 3 essentially complete (Part IV capstone)"]
    optional: false
    note: "decisions.md 9: L² is used only for von Neumann's proof, and the L² facts it needs (nearest point, Riesz representation) are proved here for L²(μ) concretely; the abstract Hilbert-space chapter in Part VI will recall this as its first instance (spiral). No Lᵖ duality here even though RN makes it one step away — flag it as the Part VI forward hook."

