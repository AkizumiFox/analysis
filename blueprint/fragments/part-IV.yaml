chapters:
  - slug: urysohn-tietze
    title: "Urysohn, Tietze and Locally Compact Spaces"
    pages: 32
    sources: [[MUN.4, "§31 (separation axioms), §32 (normal spaces), §33 (Urysohn lemma), §35 (Tietze extension)"], [MUN.3, "§29 (local compactness, one-point compactification)"], [FOL.4, "§4.5 (LCH Urysohn, C_c, C_0, partitions of unity)"]]
    outline:
      - "The problem ahead: Lusin's theorem and the density of C_c in Lᵖ both need continuous functions with prescribed values on closed sets; the separation question"
      - "Separation axioms: regular and normal spaces; metric spaces and compact Hausdorff spaces are normal"
      - "In metric spaces Urysohn is free: f = d(x,A)/(d(x,A)+d(x,B))"
      - "Urysohn's lemma for normal spaces (dyadic-rational construction)"
      - "The Tietze extension theorem: bounded version by uniform approximation, then unbounded values"
      - "Locally compact Hausdorff spaces; one-point compactification; supports, C_c(X) and C_0(X)"
      - "LCH Urysohn (K ≺ f ≺ U) and finite partitions of unity subordinate to an open cover of a compact set"
    must_prove: ["metric spaces and compact Hausdorff spaces are normal", "Urysohn's lemma", "Tietze extension theorem (real-valued, closed subset of a normal space)", "one-point compactification of an LCH space is compact Hausdorff", "LCH Urysohn lemma", "partitions of unity on a compact subset of an LCH space"]
    key_examples: ["distance-function Urysohn functions in ℝᵈ", "Tietze fails for non-closed subsets (sin(1/x) on (0,1])", "ℕ and ℝⁿ one-point compactifications", "an infinite-dimensional normed space is not locally compact (pointer to Part II's ℓ²)"]
    exit_checks: ["Prove Urysohn's lemma for normal spaces", "Derive Tietze from Urysohn with the uniform-approximation argument"]
    optional: false
    note: "decisions.md 8 (second of the three topology placements). Keep it lean: no metrization theorem, no Tychonoff (Part VI). Announce the two uses up front: Lusin (lebesgue-measure) and C_c density (lp-spaces). Riesz–Markov (Part VI) will reuse the LCH Urysohn and partitions of unity."

  - slug: lebesgue-measure
    title: "Lebesgue Measure on ℝᵈ and Measurable Functions"
    pages: 58
    sources: [[SS3.0, "all (the problems that force the theory)"], [SS3.1, "§1–4 (preliminaries, exterior measure, measurable sets, invariance, Borel sets, non-measurable set, measurable functions, simple and step approximation, Littlewood's three principles)"], [BRL.5, "§5.1–5.4 (Peano–Jordan–Borel, Lebesgue measure, Carathéodory condition, nonmeasurable sets and choice)"], [BRL.6, "§6.1, 6.4 (measurable functions, Egorov, Luzin)"], [MIRA.2, "§2A, 2D, 2E (outer measure on ℝ, Lebesgue measure, Cantor set, Egorov, Luzin)"], [WZ.3, "§3.1–3.6 (outer measure, measurable sets, characterizations, Lipschitz images, nonmeasurable set)"], [WZ.4, "§4.1–4.3 (measurable functions, Egorov, Lusin)"], [FOL.1, "§1.1 (why not all sets)"], [GO.8, "Examples 1–6, 11, 17"], [GO.11, "Examples 1–4 (sets without Jordan area)"]]
    outline:
      - "From Part III's list: Jordan content is not countably additive; what a length/volume on all 'reasonable' sets must satisfy"
      - "Exterior (outer) measure via countable covers by cubes; monotonicity, countable subadditivity, approximation by open sets; m*(interval) = volume"
      - "Measurable sets (open-set approximation definition), the σ-algebra they form, countable additivity, continuity from above and below; equivalence with Carathéodory's criterion"
      - "Borel sets, G_δ and F_σ regularity; invariance under translations, dilations and reflections"
      - "Non-measurable sets: the Vitali set, with the use of choice flagged; no translation-invariant measure on all subsets"
      - "Cantor sets: the ternary set (uncountable, null) and fat Cantor sets (nowhere dense, positive measure)"
      - "Measurable functions: closure under limits, simple and step-function approximation, a.e. conventions"
      - "Littlewood's three principles: Egorov's theorem and Lusin's theorem (via Tietze)"
    must_prove: ["m* is countably subadditive and m*(Q) = |Q| for closed cubes", "measurable sets form a σ-algebra; m is countably additive", "continuity from above and below", "E measurable ⇔ E = G_δ minus null ⇔ F_σ plus null", "translation and dilation invariance", "Vitali set is not measurable", "every measurable f ≥ 0 is an increasing limit of simple functions; every measurable f is an a.e. limit of step functions", "Egorov's theorem", "Lusin's theorem"]
    key_examples: ["Vitali set", "Cantor set", "fat Cantor set", "a Lebesgue-measurable non-Borel set (Cantor function preimage; proved after bv-and-absolute-continuity or given as a cardinality argument)", "a compact plane set without Jordan area"]
    exit_checks: ["Prove that the Vitali set is not measurable and say exactly where choice is used", "Prove Egorov's theorem and show it fails on ℝ with 1_[n,n+1]"]
    optional: false
    note: "Opens by quoting the riemann-limits list (decisions.md 7). SS3's concrete route on ℝᵈ is the scaffold; the abstract Carathéodory theory comes in abstract-measure (spiral). Lusin cites Tietze from urysohn-tietze."

  - slug: lebesgue-integral
    title: "The Lebesgue Integral and the Convergence Theorems"
    pages: 58
    sources: [[SS3.2, "§1–2 (four-stage construction, convergence theorems, Riemann vs Lebesgue, L¹, invariance, translation continuity)"], [MIRA.3, "all (integration w.r.t. a measure, limits of integrals, Riemann vs Lebesgue, L¹)"], [WZ.5, "§5.1–5.5 (integral, properties, arbitrary f, Riemann–Stieltjes vs Lebesgue, Riemann vs Lebesgue)"], [BRL.6, "§6.2–6.3 (integration, MCT, DCT, Fatou, farewell to Riemann)"], [FOL.2, "§2.2–2.3 (nonnegative and complex functions)"], [GO.8, "Examples 31–36"]]
    outline:
      - "Integral of simple functions; bounded functions on sets of finite measure; the bounded convergence theorem (Arzelà's theorem from riemann-limits as a corollary)"
      - "Nonnegative functions: the integral as a sup; Fatou's lemma; the monotone convergence theorem; term-by-term integration of series"
      - "Integrable functions, linearity, absolute continuity of the integral; the dominated convergence theorem"
      - "Riemann versus Lebesgue: a Riemann-integrable function is Lebesgue integrable with the same integral; Riemann integrable ⇔ bounded and continuous a.e.; improper integrals that are not Lebesgue integrals"
      - "L¹ as a normed space of classes; completeness (Riesz–Fischer for L¹); every L¹-convergent sequence has an a.e.-convergent subsequence"
      - "Dense families in L¹(ℝᵈ): simple, step, and continuous compactly supported functions; continuity of translation in L¹"
      - "Complex-valued functions; the limit-exchange checklist revisited: which Part III ad hoc hypotheses are now theorems"
    must_prove: ["bounded convergence theorem", "Fatou's lemma", "monotone convergence theorem", "dominated convergence theorem", "Riemann-integrable ⇒ Lebesgue-integrable with equal integral", "Lebesgue's criterion for Riemann integrability", "L¹ is complete", "L¹ convergence ⇒ a.e. convergent subsequence", "step functions and C_c are dense in L¹(ℝᵈ)", "‖f(·+h) − f‖₁ → 0"]
    key_examples: ["n·1_(0,1/n) (Fatou strict)", "sin x / x: improper Riemann but not Lebesgue", "a bounded measurable function not a.e. equal to any Riemann-integrable function (GO 8.32)", "Σ integrals of a series of nonnegative functions"]
    exit_checks: ["Prove MCT, Fatou and DCT in that order, from the definition", "Prove that L¹(ℝᵈ) is complete", "Prove Lebesgue's criterion for Riemann integrability"]
    optional: false
    note: "Write the convergence-theorem proofs using only countable additivity and the definition as a sup, so abstract-measure can transfer them verbatim. Ticks off items 'limits' and 'L¹ completeness' from the Part III list."

  - slug: abstract-measure
    title: "Abstract Measure Spaces and Carathéodory's Construction"
    pages: 48
    sources: [[FOL.1, "§1.2–1.5 (σ-algebras, measures, outer measures, Borel measures on ℝ)"], [SS3.6, "§1–3.1, 3.3 (Carathéodory, metric outer measures, extension theorem, integration on a measure space, Lebesgue–Stieltjes)"], [MIRA.2, "§2B–2C (measurable spaces and functions, measures and their properties)"], [WZ.11, "§11.1–11.3 (outer measure, metric outer measure, Lebesgue–Stieltjes)"], [WZ.10, "§10.1–10.2 (additive set functions, measurable functions and integration)"], [FOL.0, "§0.5 (extended reals)"], [MIRA.5, "5.15–5.17 (monotone class theorem)"]]
    outline:
      - "σ-algebras, generated σ-algebras, Borel σ-algebras; measurable maps between measurable spaces"
      - "Measures, continuity properties, null sets, completion"
      - "Outer measures and Carathéodory's theorem; Lebesgue measure recovered"
      - "Metric outer measures: Borel sets are Carathéodory-measurable"
      - "Premeasures on algebras and the Carathéodory–Hahn extension; the π-λ (Dynkin) theorem and uniqueness of extensions; monotone class theorem"
      - "Lebesgue–Stieltjes measures on ℝ: increasing right-continuous F ↔ locally finite Borel μ_F; regularity"
      - "Integration on an abstract measure space: the convergence theorems and L¹(μ) transferred; counting measure and series"
    must_prove: ["Carathéodory's theorem", "Borel sets are measurable for a metric outer measure", "extension of a premeasure; uniqueness for σ-finite premeasures via π-λ", "π-λ theorem", "correspondence F ↔ μ_F for Lebesgue–Stieltjes measures", "outer and inner regularity of Lebesgue–Stieltjes measures", "MCT, Fatou, DCT on an abstract measure space (by pointing to the transferred proofs)"]
    key_examples: ["counting measure, Dirac measure", "μ_F for the Cantor function F (singular continuous)", "a non-σ-finite measure where uniqueness fails", "completion: Lebesgue σ-algebra is the completion of the Borel σ-algebra"]
    exit_checks: ["Prove Carathéodory's theorem", "Prove uniqueness of measures agreeing on a π-system via the π-λ theorem"]
    optional: false
    note: "Spiral return (decisions.md 6): the ℝᵈ construction of lebesgue-measure is recalled and reframed. π-λ is written originally (FOL and MIRA use the monotone class theorem; include both, π-λ as the main tool)."

  - slug: fubini-tonelli
    title: "Product Measures and the Fubini–Tonelli Theorem"
    pages: 50
    sources: [[FOL.2, "§2.5 (product measures, Tonelli, Fubini) and §2.6 first part (n-dimensional Lebesgue measure as completed product)"], [MIRA.5, "§5A–5B (products, monotone class, iterated integrals, σ-finiteness counterexample, area under graph)"], [SS3.2, "§3 (Fubini on ℝᵈ, applications) and §4* (a Fourier inversion formula)"], [WZ.6, "§6.1–6.3 (Fubini, Tonelli, applications)"], [SS3.6, "§3.1 (product measures and a general Fubini theorem)"], [GO.9, "Examples 16–17"], [GO.10, "Examples 21–22"]]
    outline:
      - "Product σ-algebras; measurability of sections of sets and functions (monotone class / π-λ)"
      - "Product measure of two σ-finite measures: existence and uniqueness"
      - "Tonelli's theorem and Fubini's theorem, full proofs"
      - "Lebesgue measure on ℝ^{d₁+d₂} as the completion of the product; the Fubini theorem for complete measures"
      - "Where the hypotheses bite: counting × Lebesgue on the diagonal, a double series with unequal iterated sums, a non-integrable f with unequal iterated integrals"
      - "Applications: measure of a set as the integral of its sections, area under a graph, convolution is defined a.e., integrability of |x|^{−α}, exchanging sums and integrals"
      - "Payoff for Part III: Fourier inversion for f ∈ L¹(ℝᵈ) with f̂ ∈ L¹, via Gaussians and Fubini"
    must_prove: ["sections of product-measurable sets and functions are measurable", "existence and uniqueness of μ × ν for σ-finite μ, ν", "Tonelli's theorem", "Fubini's theorem", "Fubini–Tonelli for Lebesgue measure on ℝᵈ (completed version)", "m(E) = ∫ m(E_x) dx", "Fourier inversion for f, f̂ ∈ L¹"]
    key_examples: ["counting measure × Lebesgue on [0,1]², diagonal set", "a_{mn} = 1 if m=n, −1 if m=n+1: unequal iterated sums", "(x²−y²)/(x²+y²)² on (0,1]²", "Sierpiński's set under CH (optional remark)"]
    exit_checks: ["Prove Tonelli's theorem for σ-finite measures", "Show Fubini fails without σ-finiteness and without integrability, with an example for each"]
    optional: false
    note: "decisions.md 10: full proofs. Part II supplied Fubini for continuous functions on rectangles; recall it explicitly and show it is a special case. KOR 47–48 examples from Part III are resolved here."

  - slug: change-of-variables
    title: "Linear Maps, Change of Variables and Polar Coordinates"
    pages: 38
    sources: [[FOL.2, "§2.6 (linear maps, Theorem 2.44; C¹ change of variables, Theorem 2.47) and §2.7 (polar coordinates)"], [MIRA.5, "§5C (Lebesgue measure on ℝⁿ, volume of the unit ball)"], [WZ.3, "§3.5 (Lipschitz and linear transformations)"], [SS3.6, "§3.2 (integration formula for polar coordinates)"], [SS3.1, "§5* (Brunn–Minkowski, optional)"]]
    outline:
      - "Uniqueness of translation-invariant Radon measures on ℝᵈ; m(TE) = |det T| m(E) for linear T"
      - "Lipschitz and C¹ maps send null sets to null sets and measurable sets to measurable sets"
      - "The C¹ change-of-variables theorem: full proof (local linearization on small cubes, then monotone convergence)"
      - "Polar coordinates: the surface measure σ on S^{d−1} with m = ρ × σ; volume of the unit ball; the Gaussian integral"
      - "Applications: integrability of |x|^{−α} near 0 and at ∞, radial functions, recovering Part II's Riemann change of variables"
      - "(Optional) The Brunn–Minkowski inequality"
    must_prove: ["m(T(E)) = |det T| m(E)", "Lipschitz images of null sets are null", "change-of-variables formula for a C¹ diffeomorphism between open sets", "polar-coordinate formula ∫ f = ∫₀^∞∫_{S^{d−1}} f(rω) r^{d−1} dσ dr", "∫_{ℝᵈ} e^{−π|x|²} dx = 1", "|B₁| = π^{d/2}/Γ(d/2+1)"]
    key_examples: ["|x|^{−α} ∈ L¹(B₁) iff α < d", "a continuous injective image of a null set with positive measure (Cantor function variant) showing C¹/Lipschitz is needed", "spherical coordinates in ℝ³"]
    exit_checks: ["Prove the C¹ change-of-variables theorem from the linear case", "Compute ∫_{ℝᵈ} (1+|x|)^{−p} and decide for which p it is finite"]
