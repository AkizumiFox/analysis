  ZOR1.1: "logic, sets, functions, cardinality → Part 0"
  ZOR1.7: "several variables: limits and continuity → Part II"
  ZOR1.8: "differential calculus in several variables → Part II"
  BLO.4: "differentiation fully covered by ABB.5, PMA.5, TAO1.10, SPI.9–11"
  BLO.6: "limits at infinity and improper integrals covered by PMA.4, TAO1.9 §9.10 and ZOR1.6 §6.5"
  BLO.9: "series fully covered by ABB.2, PMA.3, TAO1.7"

exemptions:
  - edge: [PMA.2, PMA.3]
    why: "Rudin's chapter 3 works in metric spaces and uses chapter 2 compactness only for 3.6 (BW via compactness) and for general metric spaces. Specialized to ℝ, sequences-and-limits proves BW by the monotone-subsequence and nested-interval routes from the LUB axiom, so PMA.3 §3.1–3.20 on ℝ needs only PMA.1. PMA.2 is then used in topology-of-the-real-line, after sequences, in Abbott's order (ABB.2 before ABB.3)."
  - edge: [ABB.6, ABB.7]
    why: "Abbott 7 is split. §7.1–7.3, 7.5–7.6 (definition, integrability, FTC, Lebesgue's criterion) need only ABB.4–5; only the 'Uniform Convergence and Integration' part of §7.4 uses ABB.6, and it goes to sequences-of-functions, after ABB.6. This is Rudin's order (PMA.6 before PMA.7) and lets the integral remainder and log = ∫dt/t be available for power series."
  - edge: [SPI.8, SPI.22]
    why: "Spivak's chapter 22 needs chapter 8 only for the least upper bound property, which our least-upper-bound chapter supplies from the axiom. SPI.8's own content (proofs of the three hard theorems, uniform continuity) is used later, in continuity-on-intervals; SPI.22 is a problems source for sequences-and-limits."
  - edge: [BRR.5, BRR.6]
    why: "Bressoud 6 is split. §6.2–6.3 (Cauchy's and Riemann's integral, Riemann's criterion) are used as motivation in riemann-darboux-integral and need only continuity; §6.4 (continuity without differentiability) goes to sequences-of-functions together with BRR.5 §5.2–5.4. BRR.5 §5.1 is already used in infinite-series, so BRR.5 is first read before BRR.6."

coverage_gaps:
  - "The Levi-Civita field and the hyperreals (curriculum S1 (c)): no Part I source treats them; GO 1.7 supplies a different Cauchy-complete non-Archimedean field. The Levi-Civita construction and the ultrafilter sketch of the hyperreals are original writing."
  - "The Lebesgue number lemma on ℝ and the Lebesgue-number proof of Heine–Cantor (Stage S1 exit check): not stated as such in ABB, PMA (4.19 argues with covers directly) or TAO1; write it from scratch."
  - "The ℝ(x) example (x infinite, ℕ bounded without sup): GO 1.4 gives the ordered field of rational functions but not the curriculum's framing 'where the proof of Archimedes fails'; the framing is original."
  - "Existence of a pointwise limit of continuous functions that is not Riemann integrable (Stage S1 exit check): the fat-Cantor-set construction is assembled from ABB §3.1 exercises, GO 8.6 and ABB §7.6; the exposition is original."
