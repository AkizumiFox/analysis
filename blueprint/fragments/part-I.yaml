external:
  - {needs: "quantifiers, their order and negation; proof skeletons (direct, contrapositive, contradiction); natural-deduction reading of ∀/∃ (Part 0 logic chapter, main line)", for_chapter: least-upper-bound}
  - {needs: "sets, functions, images and preimages; the sets −A, A+B, cA as images (Part 0 sets chapter, main line)", for_chapter: least-upper-bound}
  - {needs: "induction, strong induction and well-ordering as proof principles (Part 0, main line). Part I ch 1 re-locates ℕ inside ℝ as the smallest inductive set, so it needs the principles, not the Peano construction", for_chapter: least-upper-bound}
  - {needs: "the ordered-field axioms as their own def node: if the Part 0 main line (not the optional constructions) already states them, Part I ch 1 cites that node; otherwise Part I ch 1 §1 is their home and the Part 0 constructions verify them against it", for_chapter: least-upper-bound}
  - {needs: "countable sets, ℚ countable, countable union of countable sets (Part 0, main line)", for_chapter: infinite-series}
  - {needs: "countable sets and ℚ countable (Part 0): open sets as countable unions of intervals; enumeration of ℚ", for_chapter: topology-of-the-real-line}
  - {needs: "ℝ uncountable (Part 0 diagonal argument), compared with the Cantor-set/perfect-set proof given here", for_chapter: topology-of-the-real-line}
  - {needs: "countable sets (Part 0): a monotone function has countably many discontinuities; Thomae's function uses an enumeration of ℚ", for_chapter: limits-and-continuity}
  - {needs: "the negation drills 'f is uniformly continuous on A' and 'fₙ → f uniformly' (Part 0 exit checks) are recalled, not re-taught", for_chapter: continuity-on-intervals}
  - {needs: "the axiom of choice as stated in Part 0 (flagged use: ultrafilter for the hyperreals, countable choice in sequential arguments)", for_chapter: forms-of-completeness}

chapters:
  - slug: least-upper-bound
    title: "Ordered Fields and the Least Upper Bound Axiom"
    pages: 58
    sources:
      - [ABB.1, "§1.3–1.4 (axiom of completeness, density of Q, nested intervals, √2)"]
      - [PMA.1, "1.1–1.21 (ordered sets, fields, the real field, n-th roots), 1.23 extended reals"]
      - [SPI.1, "properties P1–P12 and problems on inequalities, absolute value"]
      - [ZOR1.2, "§2.1–2.2.3 (axiom system, sup existence, ℕ/ℤ/ℚ in ℝ, Archimedes)"]
      - [BLO.2, "§2.2–2.4, 2.6 (axioms for ℝ, finding ℕ, ℤ, ℚ in ℝ, LUB consequences)"]
      - [TAO1.5, "§5.4–5.6 (ordering, LUB property, real exponentiation I) — depth only"]
      - [GO.1, "ex. 3, 4, 6 (ordered field not complete; non-Archimedean ordered field; ℚ not dense)"]
    outline:
      - "Gaps in ℚ: {x∈ℚ : x²<2} has no rational sup; the ordered-field axioms (own def node), absolute value and the triangle inequality"
      - "Upper bounds, sup, inf and maximum as separate def nodes; sup A need not lie in A; conventions sup ∅ = −∞, sup of unbounded = +∞ (flagged for measure theory)"
      - "The least upper bound axiom (ax-least-upper-bound); uniqueness of sup; the greatest-lower-bound form and inf A = −sup(−A)"
      - "The ε-characterization of sup, both directions, and sup approximation (aₙ > sup A − 1/n)"
      - "ℕ, ℤ, ℚ inside ℝ (ℕ as smallest inductive subset); the Archimedean property via sup ℕ; why ℝ(x) with x infinite fails it"
      - "Density of ℚ and of the irrationals; existence of √2 (and of n-th roots) by the sup construction — the IVT template"
      - "Nested interval property via the sup of the left endpoints"
      - "Algebra of sup: monotone under inclusion, sup(cA), sup(A+B) by two inequalities"
    must_prove: ["uniqueness of sup", "ε-characterization of sup (both directions)", "inf A = −sup(−A) and the GLB property", "Archimedean property (by contradiction via sup ℕ) and 1/n < ε", "density of ℚ in ℝ (integer step by well-ordering)", "existence of √2 (ruling out s²<2 and s²>2)", "existence of positive n-th roots", "nested interval property", "sup(A+B) = sup A + sup B", "sup(cA) = c·sup A for c > 0"]
    key_examples: ["(0,1): sup not attained", "{1 − 1/n}: sup = 1 proved with ε", "finite sets: sup = max", "{x∈ℚ : x²<2} has no sup in ℚ", "ℝ(x) with x infinite: ℕ bounded without sup, Archimedes fails"]
    exit_checks: ["the ε-characterization, both directions", "sup(A+B) = sup A + sup B, both inequalities", "existence of √2 in ℝ, and that {x∈ℚ : x²<2} has no sup in ℚ", "Archimedes from the axiom, and the line where the proof fails in ℝ(x)", "verification: find the wrong line in a proof that silently assumes sup A ∈ A"]
    optional: false
    note: "Opens Part I from the axiom (environment ax, label ax-least-upper-bound) and cites no Part 0 construction. The axiom is a theorem on the Dedekind route of Part 0; say so in a remark without an @ref into the optional chapter. Do NOT prove any equivalence of completeness forms here (that is the last chapter, to avoid a cycle). Misconceptions to address explicitly: sup = max; every bounded set has a maximum; forgetting 'nonempty'; forgetting that the a in the ε-characterization depends on ε; proving one inequality only. Introduces the skills 'sup approximation', 'equality by two inequalities', 'constructing a point as a sup' (reused in IVT and Heine–Borel). Rational exponents only here; real exponents a^x wait for the power-series chapter."

  - slug: sequences-and-limits
    title: "Sequences, Subsequences and Cauchy Sequences"
    pages: 65
    sources:
      - [ABB.2, "§2.1–2.6 (limits, algebraic and order limit theorems, MCT, BW, Cauchy criterion)"]
      - [PMA.3, "3.1–3.20 restricted to ℝ (convergence, subsequences, Cauchy, upper and lower limits, special sequences)"]
      - [TAO1.6, "§6.1–6.6 (limit laws, extended reals, sup/inf of sequences, limsup/liminf, standard limits, subsequences)"]
      - [ZOR1.3, "§3.1.1–3.1.3 (limit of a sequence, Cauchy criterion, monotone criterion, partial limits)"]
      - [SPI.22, "problems"]
      - [GO.5, "ex. 1–2 (bounded divergent sequences; prescribed set of limit points)"]
    outline:
      - "Convergence of a sequence: the ε-N definition as a quantifier string; uniqueness; convergent ⇒ bounded"
      - "Algebraic and order limit theorems; the squeeze theorem"
      - "Monotone convergence theorem; recursively defined sequences (√2 iteration); e as lim (1+1/n)ⁿ"
      - "Divergence to ±∞ and the extended real line"
      - "Subsequences; every sequence has a monotone subsequence; Bolzano–Weierstrass"
      - "limsup and liminf: as limits of tail suprema and as extreme subsequential limits; the two definitions agree; convergence iff limsup = liminf"
      - "Cauchy sequences and the Cauchy criterion"
      - "Standard limits: aⁿ, n^{1/n}, a^{1/n}, n^k/aⁿ"
    must_prove: ["uniqueness of limits", "convergent ⇒ bounded", "algebraic limit theorem", "order limit theorem and squeeze", "monotone convergence theorem", "subsequences of a convergent sequence converge to the same limit", "monotone subsequence lemma", "Bolzano–Weierstrass", "the two definitions of limsup agree", "aₙ → a iff limsup = liminf = a", "Cauchy criterion (both directions)"]
    key_examples: ["(−1)ⁿ: bounded, divergent, two subsequential limits", "√2 iteration x_{n+1} = (x_n + 2/x_n)/2", "(1+1/n)ⁿ increasing and bounded", "a sequence whose subsequential limits are all of [0,1] (enumeration of ℚ∩[0,1])", "Cauchy in ℚ with no rational limit"]
    exit_checks: ["show that the two definitions of limsup agree", "negate 'aₙ → a' and 'aₙ is Cauchy' and prove a given sequence is not Cauchy", "prove BW by the monotone-subsequence route and by nested intervals"]
    optional: false
    note: "Proves MCT, BW and Cauchy completeness FROM the LUB axiom only; their converses belong to forms-of-completeness. Skills named here: ε allocation (ε/2), extracting subsequences (trigger: bounded sequence → extract), sup approximation. Rudin's chapter 3 works in metric spaces; specialize to ℝ (see exemption for PMA.2 → PMA.3)."

  - slug: infinite-series
    title: "Infinite Series"
    pages: 67
    sources:
      - [ABB.2, "§2.4 (first look at series, Cauchy condensation), §2.7–2.8 (properties, rearrangements, double sums, products)"]
      - [PMA.3, "3.21–3.55 except 3.38–3.40 (series, nonnegative series, e, root and ratio, summation by parts, absolute convergence, products, rearrangements)"]
      - [TAO1.7, "§7.1–7.5"]
      - [TAO1.8, "§8.2 only (summation on infinite sets, absolutely summable double series)"]
      - [TAO1.B, "§B.2 (decimal representation of real numbers)"]
      - [BRR.2, "§2.1–2.4 (Archimedean understanding, geometric series, harmonic series) — motivation"]
      - [BRR.4, "§4.1–4.2 (basic tests, comparison tests) — motivation and examples"]
      - [BRR.5, "§5.1 (groupings and rearrangements)"]
      - [SPI.23, "problems"]
      - [GO.6, "ex. on ratio and root test failures; Cauchy product divergence; rearrangement examples"]
    outline:
