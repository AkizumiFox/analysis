part: I
title: "Analysis on the Real Line"
summary: "Starting from the least upper bound axiom alone, Part I builds ε-N and ε-δ fluency on ℝ through sequences, series, the topology of the line, continuity, the derivative, the Riemann–Darboux integral, uniform convergence and power series, because each classical theorem of calculus (IVT, EVT, MVT, FTC, term-by-term differentiation) fails or is unprovable without completeness; it closes by proving that the forms of completeness are equivalent."

