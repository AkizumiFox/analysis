part: II
title: "Metric Spaces and Several Variables"
summary: "Lifts convergence, completeness, compactness and continuity from ℝ to metric spaces and C(K), forced by concrete problems (ODE existence and uniqueness, polynomial approximation, typical continuous functions), then does calculus in ℝⁿ (inverse and implicit functions, the Riemann integral on ℝⁿ) and ends by abstracting open sets into topological spaces."

