  - {needs: "Cantor set, nowhere dense sets (Part I); Baire category (Part II)", for_chapter: riemann-limits}

chapters:
  - slug: fourier-series-foundations
    title: "Fourier Series: Origins and Basic Properties"
    pages: 48
    sources: [[SS1.1, "all (vibrating string, heat equation, Dirichlet problem in the disc)"], [SS1.2, "§1–3 (definitions and examples, uniqueness, convolutions)"], [KOR.1, "all (motivation)"], [DM.1, "§1.8.1–1.8.3 (derivations of heat and wave equations; heat flow on the circle)"], [SS1.A, "§1 (Riemann integral recalled for functions on the circle)"]]
    outline:
      - "The vibrating string: wave equation, d'Alembert's travelling waves, standing waves, and Fourier's question of expanding an arbitrary initial shape"
      - "The heat equation and the steady state in the disc; separation of variables as the source of trigonometric series"
      - "Functions on the circle 𝕋 = ℝ/2πℤ; Riemann-integrable functions on 𝕋; Fourier coefficients, Fourier series, partial sums S_N f"
      - "Worked series: sawtooth, square wave, |x|, the plucked string; Σ sin(nx)/n recalled from Part I"
      - "Algebra of coefficients: translation, conjugation, differentiation ↔ multiplication by in; smoothness forces decay"
      - "Uniqueness: a Riemann-integrable function with zero coefficients vanishes at its points of continuity; absolutely summable coefficients give uniform convergence to f"
      - "Convolution on 𝕋: definition, algebraic properties, continuity of f*g, (f*g)^ = f̂ ĝ; approximating a Riemann-integrable function by continuous ones in L¹ with uniform bound"
    must_prove: ["uniqueness theorem (continuity point version)", "Σ|f̂(n)| < ∞ ⇒ S_N f → f uniformly (f continuous)", "f ∈ C² ⇒ f̂(n) = O(1/n²), hence uniform convergence", "(f*g)^(n) = f̂(n)ĝ(n)", "f*g is continuous for Riemann-integrable f, g", "approximation lemma: bounded Riemann-integrable f is the L¹ limit of continuous f_k with sup|f_k| ≤ sup|f|"]
    key_examples: ["plucked string", "sawtooth f(x)=x on (−π,π)", "|x| on [−π,π] and Σ1/(2k+1)² = π²/8", "a continuous function whose Fourier series is not absolutely convergent (forward pointer)"]
    exit_checks: ["Prove the uniqueness theorem without the book", "Solve the plucked-string problem and justify uniform convergence of the series"]
    optional: false
    note: "Stay strictly with Riemann-integrable functions. Complex exponentials from Part I. Convolution defined here is reused as the model for Part IV's convolution (lp-spaces)."

  - slug: good-kernels-summability
    title: "Good Kernels, Summability and Fejér's Theorem"
    pages: 38
    sources: [[SS1.2, "§4–7 (good kernels, Cesàro and Abel summability, Poisson kernel, exercises on D_N and F_N)"], [KOR.2, "all"], [KOR.4, "all (Weierstrass via Fejér)"], [KOR.28, "all (Dirichlet problem for the disc)"], [DM.1, "§1.7.3 (Weierstrass' approximation theorem)"]]
    outline:
      - "Good kernels (approximate identities): the three properties and the theorem f*K_n → f at continuity points, uniformly when f is continuous"
      - "The Dirichlet kernel is not a good kernel: closed form, ‖D_N‖₁ ≍ log N, and what this predicts about convergence"
      - "Cesàro means, the Fejér kernel and Fejér's theorem"
      - "Consequences: trigonometric polynomials are dense in C(𝕋); Weierstrass's theorem again; uniqueness again"
      - "Abel means, the Poisson kernel, Abel summability of Fourier series"
      - "The Dirichlet problem in the unit disc: the Poisson integral solves it for continuous boundary data; uniqueness by the maximum principle"
      - "Approximate identities as a pattern: the skill named, and a checklist (positivity, mass one, concentration) reused in Parts IV and VI"
    must_prove: ["good-kernel convergence theorem", "‖D_N‖₁ ≥ c log N (and ≤ C log N)", "Fejér's theorem", "trigonometric polynomials are dense in C(𝕋)", "Weierstrass approximation theorem via Fejér", "Poisson kernel is a good kernel; Abel summability of Fourier series", "Poisson integral solves the Dirichlet problem in the disc"]
    key_examples: ["D_N(x) = sin((N+½)x)/sin(x/2)", "F_N ≥ 0 closed form", "1−1+1−… is Cesàro and Abel summable to ½", "Σ n(−1)ⁿ is Abel but not Cesàro summable"]
    exit_checks: ["Fejér's theorem, and hence that trigonometric polynomials are dense in C(𝕋)", "Show ‖D_N‖₁ ~ (4/π²) log N"]
    optional: false
    note: "Name the skills 'approximate identities' and 'summability in place of convergence'. Stone–Weierstrass (Part II) may be recalled but Fejér's route must stand alone."

  - slug: mean-square-pointwise
    title: "Mean-Square and Pointwise Convergence"
    pages: 55
    sources: [[SS1.3, "all (inner products, mean-square convergence, local result, divergent continuous function, exercises incl. Gibbs)"], [KOR.9, "all"], [KOR.10, "all"], [KOR.15, "all"], [KOR.16, "all"], [KOR.17, "all (Gibbs)"], [KOR.18, "all"], [KOR.19, "all (survey: Kolmogorov, Carleson)"], [KOR.32, "all"], [KOR.33, "all"], [KOR.34, "all"], [DM.1, "§1.6 (Gibbs' phenomenon)"]]
    outline:
      - "Inner-product spaces: ℓ²(ℤ) is complete; ℛ(𝕋) with (f,g) = (1/2π)∫f ḡ is only a pre-Hilbert space (flagged; the gap returns in riemann-limits)"
      - "Best approximation: S_N f is the orthogonal projection onto trigonometric polynomials of degree ≤ N; Bessel's inequality"
      - "Mean-square convergence and Parseval's identity for Riemann-integrable functions (via density of trigonometric polynomials and best approximation)"
      - "Riemann–Lebesgue lemma; Riemann's localization principle"
      - "Pointwise convergence where f is locally Lipschitz (Dini-type criterion); jump discontinuities converge to the average"
      - "Gibbs phenomenon: overshoot ≈ 9% for the square wave"
      - "A continuous function whose Fourier series diverges at a point (explicit construction); a survey of the true answer (Kolmogorov, Carleson, Kahane–Katznelson) stated without proof"
    must_prove: ["Bessel's inequality", "S_N f is the best L² approximation", "Parseval's identity and L² convergence for Riemann-integrable f", "Riemann–Lebesgue lemma", "localization principle", "S_N f(x₀) → f(x₀) when f is Lipschitz near x₀", "existence of a continuous function with divergent Fourier series at 0"]
    key_examples: ["Σ1/n² = π²/6 and Σ1/n⁴ = π⁴/90 by Parseval", "square wave and the Gibbs overshoot", "the SS1 construction of a divergent continuous function", "link: ‖D_N‖₁ unbounded ⇒ divergence is to be expected"]
    exit_checks: ["Prove Parseval for Riemann-integrable functions", "Prove pointwise convergence at a point where f is locally Lipschitz"]
    optional: false
    note: "The divergence example is done by explicit construction here; Part VI redoes it by the uniform boundedness principle (curriculum S4 (d)). Record the first entry of the 'what we need' list: ℛ(𝕋) is not complete, so Parseval gives an isometry into ℓ² that is not onto."

  - slug: fourier-series-applications
    title: "Applications of Fourier Series"
    pages: 45
    sources: [[SS1.4, "all (isoperimetric inequality, Weyl equidistribution, nowhere differentiable function, heat equation on the circle)"], [KOR.3, "all"], [KOR.11, "all"], [KOR.35, "all"], [KOR.36, "all"], [DM.1, "§1.7.2, 1.7.4, 1.7.6 (Wirtinger, isoperimetric, equidistribution); §1.8.3 (heat flow on the circle)"]]
    outline:
      - "Wirtinger's inequality and Hurwitz's proof of the isoperimetric inequality, with the equality case"
      - "The circle ℝ/ℤ and the exponentials e^{2πikx}; Weyl's equidistribution criterion"
      - "Equidistribution of {nγ} for irrational γ; further sequences as exercises (van der Corput optional)"
      - "Lacunary series and a continuous nowhere-differentiable function (Weierstrass type, via delayed means)"
      - "The heat equation on the circle: the heat kernel as a good kernel, smoothing, and the solution of the initial-value problem"
    must_prove: ["Wirtinger's inequality", "isoperimetric inequality L² ≥ 4πA for C¹ closed curves, with equality iff circle", "Weyl's criterion", "{nγ} is equidistributed iff γ is irrational", "Σ 2^{−nα} e^{i2ⁿx} (0<α<1) is continuous and nowhere differentiable", "heat kernel on the circle is a good kernel and u = f*H_t solves the heat equation"]
    key_examples: ["lacunary series Σ 2^{−nα} e^{i 2ⁿ x}", "{n²γ} (exercise)", "leading digits of 2ⁿ (Benford-type, exercise)", "heat kernel on 𝕋 via its Fourier series"]
    exit_checks: ["Prove Weyl's criterion and apply it to {nγ}", "Prove the isoperimetric inequality by Parseval"]
    optional: false
    note: "Weyl's criterion uses the characters of ℝ/ℤ concretely; finite-fourier-analysis later recasts them in group language (decisions.md 13)."

  - slug: fourier-transform-line
    title: "The Fourier Transform on ℝ"
    pages: 58
    sources: [[SS1.5, "all (moderate decrease, 𝒮, inversion, Plancherel, heat and Poisson on ℝ, Poisson summation, theta, Heisenberg)"], [SS1.A, "§3 (improper integrals, functions of moderate decrease)"], [KOR.46, "all"], [KOR.47, "all (Riemann-setting interchange of integrals)"], [KOR.48, "all"], [KOR.49, "all"], [KOR.51, "all"], [KOR.52, "all (convolution on 𝕋 revisited alongside ℝ)"], [KOR.53, "all"], [KOR.55, "all"], [KOR.60, "all"], [KOR.27, "all"], [DM.2, "§2.2 (C_c^∞ transforms), §2.7.2 (heat flow), §2.8 (Heisenberg), §2.11.3 (Poisson summation)"]]
    outline:
      - "Integration over ℝ for functions of moderate decrease; the Riemann-setting rules for exchanging integrals and differentiating under the integral sign, with explicit hypotheses (and a warning example when they fail)"
      - "The Schwartz space 𝒮(ℝ); the Fourier transform on 𝒮; the Gaussian is its own transform"
      - "Gaussians as good kernels; Fourier inversion and the Plancherel formula on 𝒮; extension to functions of moderate decrease"
      - "Convolution on ℝ; the heat equation on the line and the heat kernel; the steady-state problem in the upper half-plane and the Poisson kernel"
      - "The Poisson summation formula; the theta functional equation; the circle heat kernel by periodization"
      - "The Heisenberg uncertainty principle"
      - "(Optional) Weierstrass approximation via the heat kernel, and Fejér's theorem for Fourier integrals"
    must_prove: ["𝒮 is closed under ∂, multiplication by x, and the Fourier transform", "(e^{−πx²})^ = e^{−πξ²}", "Fourier inversion on 𝒮", "Plancherel ‖f̂‖₂ = ‖f‖₂ on 𝒮", "(f*g)^ = f̂ ĝ on 𝒮", "Poisson summation for f, f̂ of moderate decrease", "theta functional equation ϑ(s) = s^{−1/2} ϑ(1/s)", "Heisenberg inequality"]
    key_examples: ["heat kernel H_t(x) = (4πt)^{−1/2} e^{−x²/4t}", "Poisson kernel for the upper half-plane", "(1/(1+x²))^ and e^{−2π|ξ|}", "a pair of continuous iterated integrals that disagree (KOR 47–48)"]
    exit_checks: ["Prove the theta functional equation by Poisson summation", "Prove Fourier inversion on 𝒮 from the Gaussian good kernel"]
    optional: false
    note: "The Riemann framework is felt here: every exchange of limits needs its own ad hoc hypothesis; record these on the 'what we need' list for riemann-limits."

  - slug: fourier-transform-rd
    title: "The Fourier Transform on ℝᵈ and the Wave Equation"
    pages: 50
    sources: [[SS1.6, "§1–4, 6 (symmetries, integration on ℝᵈ, FT on 𝒮(ℝᵈ), wave equation, radial symmetry and Bessel functions); §5 optional (Radon transform)"], [SS1.A, "§2–3 (multiple Riemann integrals, repeated integrals, change of variables, spherical coordinates)"], [KOR.64, "all"], [DM.2, "§2.10–2.11 (several-dimensional Fourier integrals, spherical waves, Radon)"]]
    outline:
      - "Riemann integration on ℝᵈ for functions of moderate decrease; polar coordinates for continuous functions (proved from Part II's Jordan content and linear change of variables)"
      - "𝒮(ℝᵈ) and the Fourier transform; behaviour under translations, dilations and rotations; inversion and Plancherel"
      - "The wave equation in ℝᵈ × ℝ: solution by Fourier transform, conservation of energy, uniqueness"
      - "ℝ³: spherical means, Kirchhoff's formula, Huygens' principle; ℝ²: the method of descent and the failure of Huygens"
      - "Radial functions: the Fourier transform of a radial function is radial; Bessel functions"
      - "(Optional) The X-ray transform in ℝ² and the Radon transform in ℝ³"
    must_prove: ["Fourier transform commutes with rotations", "inversion and Plancherel on 𝒮(ℝᵈ)", "existence and energy-uniqueness for the wave equation with 𝒮 data", "Kirchhoff's formula in ℝ³", "polar-coordinate formula for continuous functions of moderate decrease"]
    key_examples: ["e^{−π|x|²} on ℝᵈ", "transform of surface measure on S² (sin(2π|ξ|)/(π|ξ|))", "Huygens fails in ℝ²"]
    exit_checks: ["Derive the solution of the wave equation in ℝ³ and explain Huygens' principle"]
    optional: false
    note: "Needs polar coordinates in the Riemann setting. If Part II's ℝⁿ module does not include them, this chapter proves them for continuous functions of moderate decrease (SS1 App. §2.4, 3.3). The general C¹ change of variables is not used; Part IV proves it in full."

  - slug: finite-fourier-analysis
