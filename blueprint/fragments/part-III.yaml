  - slug: riemann-limits
    title: "What the Riemann Integral Lacks"
    pages: 42
    sources: [[SS3.0, "Introduction §1–5 (completion of Fourier series, limits of continuous functions, length of curves, differentiation and integration, the problem of measure)"], [MIRA.1, "§1B (Riemann integral is not good enough)"], [BRL.1, "§1.1 (the five big questions)"], [BRL.2, "§2.2–2.3 (nondifferentiable integrals, Hankel, the class of 1870)"], [BRL.4, "§4.1–4.3 (Smith–Volterra–Cantor sets, Volterra's function, term-by-term integration, Arzelà–Osgood)"], [SS1.3, "§1.1 revisited (ℛ is not complete)"], [SS1.A, "§1.2 (sets of measure zero, Lebesgue's criterion)"], [KOR.19, "all (pointwise convergence needs a new integral)"], [KOR.C, "all (weakening hypotheses)"], [GO.4, "Examples 2, 5, 9, 10"], [GO.7, "Examples 5, 6"]]
    outline:
      - "Taking stock: every place in Parts I–III where a limit exchange, an iterated integral or a differentiation under the integral needed an ad hoc hypothesis"
      - "Incompleteness: an explicit L²-Cauchy sequence of step functions on [0,1] with no Riemann-integrable limit; Parseval maps ℛ(𝕋) into ℓ² but not onto"
      - "Limits: a bounded increasing sequence of Riemann-integrable functions whose limit is not Riemann integrable; Arzelà's bounded convergence theorem as the best available statement"
      - "The fundamental theorem of calculus fails: Volterra's function, a differentiable function with bounded, non-integrable derivative"
      - "Length of sets: the fat (Smith–Volterra–Cantor) set; Jordan content is only finitely additive; Lebesgue's criterion already speaks the language of measure zero"
      - "Pointwise convergence of Fourier series: the true answers (Kolmogorov's divergent L¹ series, Carleson's theorem) live in a larger space"
      - "The list: what an integral must provide (countable additivity, monotone and dominated limits, a complete L¹ and L², Fubini without continuity, FTC for all differentiable-enough functions), with a map to the Part IV chapters that deliver each item"
    must_prove: ["ℛ[0,1] with the L² distance is not complete (explicit Cauchy sequence)", "a bounded monotone limit of Riemann-integrable functions need not be Riemann integrable", "the fat Cantor set is closed, nowhere dense, of positive outer Jordan content, and its indicator is not Riemann integrable", "the image of ℛ(𝕋) under f ↦ (f̂(n)) is a proper dense subspace of ℓ²"]
    key_examples: ["indicator of the rationals as a monotone limit of indicators of finite sets", "fat Cantor set", "Volterra's function (construction sketched, key properties proved)", "Σ_{n} a_n e^{inx} with (a_n) ∈ ℓ² not the coefficients of any Riemann-integrable function"]
    exit_checks: ["Explain why the Riemann-integrable functions are incomplete in the L² distance, and write the 'what we need' list", "Give a sequence of continuous functions converging pointwise and boundedly to a non-integrable function"]
    optional: false
    note: "decisions.md 7: this chapter is the forcing problem for Part IV and must end with the explicit list; Part IV's first measure chapter opens by quoting it. Arzelà's bounded convergence theorem is stated here; its proof is given in Part IV as a corollary of the bounded convergence theorem (BRL §4.3 has an elementary proof the drafter may include as optional). Volterra's function may be sketched with its key properties proved."

