part: III
title: "Fourier Analysis in the Riemann Setting"
summary: "Fourier series and the Fourier transform on 𝒮(ℝᵈ), built entirely on the Riemann integral: summability, mean-square and pointwise convergence, applications, and finite abelian groups. The Part ends by listing what the Riemann framework cannot do, and that list motivates Part IV."

