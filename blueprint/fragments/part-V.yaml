coverage_gaps:
  - "UCLA-style mixed qual problem sets (exit checks for continuation-and-picard) must be assembled and written originally."
  - "Transplanting the disc Dirichlet problem to a simply connected Jordan region via the Riemann map needs Carathéodory boundary extension, which none of the sources proves at this level; it is stated, not proved."
