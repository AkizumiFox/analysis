part: V
title: "Complex Analysis"
summary: "Complex differentiability turns out to be so rigid that one integral formula controls everything; the Part runs from Goursat to the Riemann mapping theorem and then through the qualifying-exam second layer (harmonic and subharmonic functions, normal families, products, continuation, Picard), with normal families as the complex spiral node of Arzelà–Ascoli."
