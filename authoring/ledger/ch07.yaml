    hash: 9092b617bc79
    date: '2026-10-11'
    model: claude-opus-5-5
    evidence: '01-naturals-and-well-ordering.md:95 The solution says P(m) must quantify over every n,
      and that ''a hypothesis about one fixed n would not do''. This is false: the step uses P(m) at the
      same n, so n can be fixed before the induction, just as (b) fixes m.'
